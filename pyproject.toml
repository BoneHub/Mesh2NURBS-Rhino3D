[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rhinoMeshTools"
version = "0.2"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "point_cloud_utils",
    "pandas",
    "vedo",
    "matplotlib",
]

[project.scripts]
mesh2cad = "rhinoMeshTools.cli_full:main"
fix-mesh = "rhinoMeshTools.cli_fix:main"